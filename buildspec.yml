
version: 0.2

phases:
  install:
    commands:
      - echo "Preparing the application build"

  build:
    commands:
      - echo "Validating application files"
      - test -f index.html
      - test -f appspec.yml
      - test -f scripts/install_dependencies.sh
      - test -f scripts/start_server.sh
      - test -f scripts/stop_server.sh

  post_build:
    commands:
      - echo "Build validation completed successfully"

artifacts:
  files:
    - index.html
    - appspec.yml
    - scripts/**/*
